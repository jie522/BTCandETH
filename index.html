<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#12141c">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>ETHGRID 合約網格</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="css/style.css?v=20260930b">
<link rel="stylesheet" href="css/viz.css?v=20260930b">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ETHGRID">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<script>
/* 主題要在畫面畫出來之前套用,不然深色模式的人會先閃一下白底 */
(function () {
  try {
    var s = JSON.parse(localStorage.getItem('eg.settings') || '{}');
    if (s.theme === 'dark' || s.theme === 'light') document.documentElement.setAttribute('data-theme', s.theme);
    document.documentElement.setAttribute('data-up', s.upColor === 'green' ? 'green' : 'red');
  } catch (e) { /* 讀不到就用預設 */ }
})();
</script>
</head>
<body>

<header class="app-header">
  <div class="hdr-l"><h1 id="hdr-title">行情與訊號</h1><div id="hdr-sub" class="hdr-sub">ETH 永續合約</div></div>
  <div class="hdr-r">
    <button class="icon-btn" data-act="refresh" aria-label="更新行情"><span data-icon="refresh" data-size="22"></span></button>
    <button class="icon-btn" data-act="settings" aria-label="設定"><span data-icon="gear" data-size="22"></span></button>
  </div>
</header>

<main id="main">
  <section id="page-market" class="page active"></section>
  <section id="page-calc" class="page"></section>
  <section id="page-backtest" class="page"></section>
  <section id="page-saved" class="page"></section>
</main>

<nav class="tabbar">
  <button class="tab active" data-tab="market"><span data-icon="chart" data-size="24"></span><span>行情</span></button>
  <button class="tab" data-tab="calc"><span data-icon="grid" data-size="24"></span><span>試算</span></button>
  <button class="tab" data-tab="backtest"><span data-icon="flask" data-size="24"></span><span>回測</span></button>
  <button class="tab" data-tab="saved"><span data-icon="bookmark" data-size="24"></span><span>我的網格</span></button>
</nav>

<script src="js/store.js?v=20260930b"></script>
<script src="js/ui.js?v=20260930b"></script>
<script src="js/market.js?v=20260930b"></script>
<script src="js/grid.js?v=20260930b"></script>
<script src="js/viz.js?v=20260930b"></script>
<script src="js/signal.js?v=20260930b"></script>
<script src="js/app.js?v=20260930b"></script>
</body>
</html>
